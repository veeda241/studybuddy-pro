name: CI — Backend & Frontend

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  python-tests:
    name: Python backend tests + Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r studybuddy-pro-backend/python_backend/requirements.txt

      - name: Run pytest
        run: pytest -q studybuddy-pro-backend/python_backend/tests

      - name: Build Docker image for backend
        run: |
          docker build -t studybuddy-python-backend -f studybuddy-pro-backend/python_backend/Dockerfile studybuddy-pro-backend/python_backend

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build
